<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список бажань (Vue 3)</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Крок 2: Підключення Vue 3 через CDN без збірки -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/app.js" defer></script>
</head>
<body>

    <header class="site-header">
        <h1>Список бажань</h1>
    </header>

    <!-- Кореневий контейнер застосунку Vue 3 -->
    <div id="app" class="app-layout">
        <main>
            <!-- Секція 1: Форма додавання нового бажання через @submit.prevent -->
            <section class="form-section">
                <h2>Додати бажання</h2>
                <form @submit.prevent="addWish">
                    <div class="form-group">
                        <label for="wish-title">Назва бажання</label>
                        <input type="text" id="wish-title" v-model.trim="newTitle" required placeholder="Наприклад: Бездротова мишка">
                    </div>
                    <div class="form-group">
                        <label for="wish-price">Ціна (грн)</label>
                        <input type="number" id="wish-price" v-model.number="newPrice" required min="0" placeholder="1500">
                    </div>
                    <div class="form-group">
                        <label for="wish-priority">Пріоритет:</label>
                        <select id="wish-priority" v-model="newPriority">
                            <option value="високий">Високий</option>
                            <option value="середній">Середній</option>
                            <option value="низький">Низький</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Додати у список</button>
                </form>
            </section>

            <!-- Секція 2: Список збережених бажань (компонентний підхід) -->
            <section class="wishes-section">
                <div class="section-header-row">
                    <h2>Мої бажання</h2>
                    <button type="button" class="btn-reload" :disabled="isLoading" @click="loadFromAPI">
                        🔄 Оновити з сервера
                    </button>
                </div>

                <!-- Індикація стану завантаження або помилки API -->
                <div v-if="isLoading" class="status-message status-loading">
                    ⏳ Завантаження списку бажань із сервера...
                </div>
                <div v-else-if="errorMessage" class="status-message status-error">
                    ⚠️ {{ errorMessage }}
                </div>

                <!-- Крок 5: Декларативний рендер циклом v-for з :key="wish.id" -->
                <div id="wishlist" class="wishlist-grid">
                    <wish-item
                        v-for="wish in wishes"
                        :key="wish.id"
                        :id="wish.id"
                        :name="wish.name"
                        :price="wish.price"
                        :priority="wish.priority"
                        :purchased="wish.purchased"
                        @toggle="toggleWish"
                    ></wish-item>
                </div>
            </section>
        </main>

        <!-- Блок підсумку з автоматичним перерахунком через computed -->
        <aside class="summary-aside">
            <h2>Підсумок</h2>
            <p>Загальна вартість бажань: <strong>{{ totalPrice }} грн</strong></p>
            <p class="purchased-stats">Придбано: {{ purchasedCount }} з {{ wishes.length }}</p>
        </aside>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Список бажань. Автор: Кльован Роман. Навчальний проєкт КПІ (ФІОТ)</p>
    </footer>

</body>
</html>
