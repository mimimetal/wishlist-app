<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список бажань</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header class="site-header">
        <h1>Список бажань</h1>
    </header>

    <div class="app-layout">
        <main>
            <!-- Секція 1: Форма додавання -->
            <section class="form-section">
                <h2>Додати бажання</h2>
                <form id="wish-form">
                    <div class="form-group">
                        <label for="wish-title">Назва бажання</label>
                        <input type="text" id="wish-title" name="title" required placeholder="Наприклад: Навушники">
                    </div>
                    <div class="form-group">
                        <label for="wish-price">Ціна (грн)</label>
                        <input type="number" id="wish-price" name="price" required min="0" placeholder="1500">
                    </div>
                    <div class="form-group">
                        <label for="wish-priority">Пріоритет:</label>
                        <select id="wish-priority" name="priority">
                            <option value="високий">Високий</option>
                            <option value="середній" selected>Середній</option>
                            <option value="низький">Низький</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Додати у список</button>
                </form>
            </section>

            <!-- Секція 2: Список бажань (завантаження через API + локальні) -->
            <section class="wishes-section">
                <div class="section-header-row">
                    <h2>Мої бажання</h2>
                    <!-- Кнопка повторного запиту до API (Крок 10) -->
                    <button type="button" id="reload-btn" class="btn-reload">🔄 Оновити з сервера</button>
                </div>

                <!-- Блок для індикації завантаження та помилок (Кроки 7-8) -->
                <div id="api-status" class="status-message" aria-live="polite"></div>

                <!-- Контейнер для карток -->
                <div id="wishlist" class="wishlist-grid"></div>
            </section>
        </main>

        <!-- Блок підсумку -->
        <aside class="summary-aside">
            <h2>Підсумок</h2>
            <p>Загальна вартість бажань: <strong id="total-price">0 грн</strong></p>
        </aside>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Список бажань. Автор: Кльован Роман. Навчальний проєкт КПІ (ФІОТ)</p>
    </footer>

</body>
</html>
